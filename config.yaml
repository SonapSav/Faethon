# Faethon configuration.
#
# Everything machine-specific lives here so the code stays portable: moving to
# another Pi should mean editing this file and nothing else.

audio:
  # ALSA device strings. Use names, never card indices -- indices shift when
  # USB devices are re-plugged or the machine reboots.
  #   arecord -L   lists capture devices
  #   aplay -L     lists playback devices
  # "plug" prefix lets ALSA convert rate/format for us (the mic is natively
  # 48 kHz stereo; we want 16 kHz mono).
  input_device: "plughw:CARD=Microphone,DEV=0"
  output_device: "plughw:CARD=Headphones,DEV=0"

  sample_rate: 16000        # openWakeWord and Whisper both want 16 kHz mono
  frame_ms: 80              # openWakeWord's native frame size (1280 samples)

wake:
  # "Hey Rhasspy". Named after the offline voice assistant project; no Rhasspy
  # software is involved. Chosen over "Alexa" and "Hey Jarvis" because it is an
  # uncommon phrase, so it won't collide with an Echo or with the television.
  #
  # Measured on a real recording of this voice through this mic:
  #   hey_rhasspy   0.9999   all 8 utterances detected, 0.974-0.9999
  #   hey_jarvis    0.9976
  #   hey_roxy      0.5494   custom model, 1 of ~4 detected -- see models/
  model: "hey_rhasspy"

  # True positives land at 0.974-0.9999, while non-target speech scores 0.083
  # and white noise 0.038. 0.7 sits in that gap with room on both sides: it
  # caught every attempt in testing while leaving margin against false wakes.
  # Raise if it false-triggers, lower if it misses you.
  threshold: 0.7
  # After a detection, ignore further detections for this long so one utterance
  # cannot fire twice.
  refractory_sec: 2.0

utterance:
  # End-of-speech detection after the wake word fires.
  vad_aggressiveness: 2     # webrtcvad 0-3; higher = more aggressive filtering
  # Trailing silence that ends an utterance. Only applies AFTER you've started
  # talking. This is dead air you feel directly, and 600ms is about the floor
  # before natural mid-sentence pauses start cutting people off.
  silence_ms: 600

  # How long to wait for you to start talking in the first place. Raise this if
  # Faethon gives up while you're still thinking about what to ask.
  start_timeout_ms: 5000

  # Sustained voice required before Faethon believes you've started. Below this,
  # a cough or a door closing would start the end-of-speech clock and kill the
  # turn ~600ms later. Raise it in a noisy room.
  speech_onset_ms: 120

  min_ms: 400               # shorter than this is treated as a false start
  max_ms: 15000             # hard cap so a stuck stream can't record forever

conversation:
  # Keep listening after each reply, so a back-and-forth only needs the wake
  # word once. A rising chime opens the window, a falling one closes it.
  follow_up: true

  # How long that window stays open with nobody speaking. This is the only
  # period when the mic is live without anyone having deliberately triggered
  # it, so it is a privacy setting as much as a latency one -- and it is spent
  # in full, as silence, at the end of every conversation.
  #
  # Below ~3000 it clips people who are still deciding what to ask next; above
  # ~8000 the pause after a reply starts to feel like a hang.
  follow_up_ms: 5000

  # Say the wake word while Faethon is talking and it stops. Useful when the
  # model answers a one-line question with a paragraph.
  #
  # This needs no echo cancellation, which is what usually makes barge-in hard.
  # A wake-word model listens for one phrase rather than for speech in general,
  # and Faethon never says its own wake word: playing a 30s reply through the
  # speaker and scoring the recorded microphone gave a median of 0.0000 and a
  # peak of 0.0014 against a threshold of 0.7, with no false trigger.
  #
  # The cost is one inference per 80ms frame while speaking -- about 16% of one
  # core, and nothing when Faethon is quiet.
  barge_in: true

  # Wake score needed to interrupt. Far lower than wake.threshold on purpose:
  # Faethon's own voice does not trigger the detector, but it does mask yours.
  # Playing a reply and a real recording of the wake word through the speaker
  # together, at the equal loudness they were measured to have at the mic:
  #
  #   wake word, quiet room             0.9999
  #   wake word, over Faethon talking   0.3681   <- what this has to catch
  #   Faethon talking, no wake word     0.0002   <- what it must not catch
  #
  # At wake.threshold (0.7) barge-in never fires at all. 0.1 sits three and a
  # half times under the masked phrase and five hundred times over the floor.
  #
  # Raise it if replies cut themselves off; lower it if you have to shout. If
  # you have to shout a lot, turn the speaker down -- detection falls off
  # sharply once Faethon is louder than you are at the microphone.
  barge_in_threshold: 0.1

  # A conversation cannot run past these without a fresh wake word.
  #
  # Not a latency tuning. The follow-up window is the only period when the
  # microphone is live without anyone having deliberately triggered it, and
  # anything that keeps producing transcribable speech -- a television in the
  # same room -- re-opens it on every turn. Unbounded, the exception becomes
  # the steady state: an open mic streaming the room to Whisper indefinitely,
  # with nobody having said the wake word since whenever.
  #
  # Deliberately loose, because this is a bound on runaway rather than a trim
  # on normal use. The longest real conversation recorded here was five
  # follow-ups, so twenty turns and five minutes cannot touch one.
  #
  # Both exist because they fail differently: turns bound the cost, since each
  # is a paid call, and seconds bound how long the microphone stays live. 0
  # disables either.
  max_turns: 20
  max_seconds: 300

  # Say hello once when the service starts, so a restart is audible from the
  # other side of the room. The sentence is pre-rendered to assets/greeting.wav
  # rather than synthesised each boot, so it still plays when OpenRouter is
  # down, out of credit, or the wifi is not up yet -- which is when knowing the
  # service came back matters most. Reword it in scripts/make_speech.py and
  # re-run that to regenerate.
  #
  # Played before the microphone is opened. The current wording scores 0.0001
  # on the wake model through the speaker and mic, so it is the words that make
  # it safe, not the ordering -- an earlier draft opening "Hi, I am Rhasspy"
  # measured 0.5036, still under the 0.7 wake threshold but five thousand times
  # higher and well over the 0.1 barge-in uses. Keep the assistant's name out
  # of the greeting, or it can wake itself.
  greet_on_start: true

weather:
  # Where "the weather" means when nobody names a place. Right-click any map to
  # get coordinates; four decimals is far more precision than a forecast has.
  #
  # Open-Meteo, which needs no key and no account -- so this skill cannot be
  # half-configured, and works on a fresh clone.
  latitude: 24.4330
  longitude: 54.6511
  place_name: "Abu Dhabi"   # what Faethon calls it out loud
  units: "metric"         # or "imperial" for Fahrenheit

air:
  # Air quality and UV, at the same coordinates as the weather above.
  #
  # Dust is why this exists. It is the weather that changes your day here and
  # is completely invisible to a temperature forecast -- measured on the
  # afternoon this was built, the weather skill said "45 and clear in Abu
  # Dhabi" while dust sat at 310 micrograms and the European index read very
  # poor. Both sentences were true; only one was useful.
  #
  # These thresholds are for the unprompted warning only, not for the spoken
  # answer. WHO's PM10 guideline is 45, but Gulf background routinely sits
  # above 100, so a line drawn there would fire most days and mean nothing.
  dust_warn: 200.0          # micrograms per cubic metre
  uv_warn: 8.0              # WHO calls 8-10 "very high", 11+ "extreme"
  check_every_minutes: 30   # both move over hours; checking faster buys nothing

turn_log:
  # One line per turn in /var/lib/faethon/turns.jsonl, so the next threshold
  # can be measured rather than guessed.
  #
  # Every number here that turned out right was measured -- the wake threshold
  # from scoring a real voice, the idle window from plotting 71 real gaps, the
  # barge-in threshold from a mixing experiment -- and each of those datasets
  # had to be collected by hand for the occasion. The ones that were not
  # measured show it: the conversation cap is 20 turns and 5 minutes because
  # three conversations happened to be in the journal at the time.
  #
  # METADATA ONLY. Routes, latencies, costs, text lengths -- never transcripts.
  # journald already keeps the words, and whether it should is a live decision;
  # recording them again here would answer it by accident.
  #
  # Read it with: uv run faethon-turns [--days N]
  enabled: true

  # Rotates one generation back at this size. Roughly 200 bytes a turn, so
  # years before it matters -- but an SD card is the part of a Pi that wears
  # out, and a log nobody prunes is a slow way to fill one. 0 never rotates.
  max_mb: 5

announcements:
  # When Faethon may speak without being asked.
  #
  # Eight things can already do so -- timers, thermal and under-voltage
  # warnings, and the status clips for a lost microphone, a lost network and a
  # low balance -- and nothing coordinated them. Each decided on its own to say
  # its piece once, which reads fine one at a time and worse with every source
  # added. None of them knew what time it was either, so a latched
  # under-voltage flag would announce itself at three in the morning.
  #
  # Informational announcements are held between these two times. A timer is
  # not informational: you asked for it, and an eight-hour one set in the
  # evening should go off when you said. Set both the same to disable.
  #
  # A held announcement is deferred, not lost -- the budget is checked before a
  # skill is ticked, so the skill keeps its state and offers the same thing
  # again once quiet hours end.
  quiet_start: "22:30"
  quiet_end: "07:30"

  # Never two announcements in a row without a pause. A timer coming due in the
  # same moment the credit warning crosses otherwise gives chime, sentence,
  # chime, sentence, with nothing between them. 0 disables.
  min_gap_seconds: 30

credit:
  # Warn before the account runs dry. At zero every leg stops -- no
  # transcription, no thinking, no speech -- so the failure is total silence
  # and the only thing still able to report it is a pre-rendered clip.
  #
  # COUPLED TO THE AUDIO: the clip says "below half a dollar", which is only
  # true because this is 0.50. Change it and you must reword and re-render
  # scripts/make_speech.py; a test pins the two together so you can't forget.
  #
  # 0 disables the warning.
  warn_below: 0.50

  # At most this often, and only after a turn -- never in the wake loop, where
  # a 250-450ms /credits call is three or four frames of deafness and a real
  # chance of missing a wake word. An idle house never checks, which is fine:
  # nobody talking means nobody spending.
  check_every_minutes: 60

models:
  # Turbo has a distilled decoder: markedly faster and 2.25x cheaper, with a
  # small accuracy cost that doesn't show up on short English commands.
  # Switch back to openai/whisper-large-v3 if you need the accuracy.
  stt: "openai/whisper-large-v3-turbo"
  llm: "deepseek/deepseek-v4-flash"
  # Re-benchmarked 2026-08-21 on a real announcement, six calls each. What
  # matters for the wait is time to FIRST audio, not total synthesis time:
  # Faethon streams, and every one of these generates several times faster
  # than the speech plays, so generation is never the bottleneck.
  #
  # The chosen model's figures are measured through synthesize_stream, i.e.
  # the path Faethon actually speaks through; the rest are bare HTTP from the
  # same session. The two methods agree closely where both were run (0.32s
  # against 0.35s median), so the ranking holds -- but the numbers below are
  # not all from the same harness, and the first call after an idle gap runs
  # slow on any of them (1.55s once, settling by the third call).
  #
  #   microsoft/mai-voice-2-flash  0.35s median / 0.88s worst, $15/M chars
  #                                byte-identical output across all six calls,
  #                                and the whole Azure neural voice catalogue
  #   fish-audio/s1                0.43s / 0.53s -- still the tightest spread
  #                                of anything measured, but ONE voice
  #   x-ai/grok-voice-tts-1.0      0.50s / 1.38s, five voices (Eve Ara Rex Sal Leo)
  #   fish-audio/s2.1-pro-free     0.50s / 0.86s, free, but no voice parameter
  #                                and no stated availability guarantee
  #   deepgram/flux-tts:free       0.51s / 1.62s, free, 36 voices, worst tail
  #   qwen/qwen-audio-3.0-tts-*    unusable: demands an explicit voice, refuses
  #                                to enumerate them, 12 DashScope names failed
  #   sesame/csm-1b                5.7s -- slower than speech, would underrun
  #   hexgrad/kokoro-82m           cheapest by far, but hangs at peak hours
  tts: "microsoft/mai-voice-2-flash"

stt:
  # Pin the language. Whisper otherwise detects it per request from the audio
  # alone, and on a short, accented, or noisy clip it guesses wrong -- then
  # transcribes *into* that language, so an English question comes back as
  # Greek or Spanish. Turbo is more prone to this than full large-v3, whose
  # undistilled decoder is better at language identification.
  # Set to "" to restore auto-detection for a multilingual household.
  language: "en"

  # 0 = deterministic decoding. Higher lets Whisper wander, which is one way to
  # get a different transcript from identical audio.
  temperature: 0.0

llm:
  # A spoken reply wants to be short. 80-100 tokens is plenty and keeps both
  # cost and time-to-first-word down.
  # A cap, not a target -- the model stops when it's done, so raising this
  # costs nothing unless it's actually needed. 100 was truncating replies
  # mid-word, which is far worse spoken than written.
  max_tokens: 160
  temperature: 0.7
  history_turns: 10         # in-RAM conversational memory

  # Minutes of silence after which the conversation is forgotten. Without a
  # bound, context never ends: ask about France in the morning and "how big is
  # it?" in the afternoon still answers about France -- wrong in a way nothing
  # announces.
  #
  # Chosen from 71 real interactions on this Pi. The gaps between turns fall
  # into two clumps with a trough between them:
  #
  #   under 1 min   53 gaps   one conversation, still going
  #   1-5 min       10 gaps
  #   5-10 min       1 gap    <- the trough
  #   10-30 min      5 gaps   came back later, new subject
  #   over 30 min    1 gap
  #
  # 10 minutes sits in that trough: it fires on 9% of gaps, separating "still
  # talking" from "came back later" without cutting a live conversation short.
  # 30 minutes would have fired once in seventy -- generous enough to barely
  # do anything. 0 disables it.
  history_idle_minutes: 10

  # DeepSeek V4 is a hybrid reasoning model and decides per-request whether to
  # think first. Thinking tokens are billed against max_tokens, so on a 100
  # token budget it can spend the whole allowance reasoning and return an empty
  # reply -- Faethon says nothing. Measured: 99 of 100 tokens on one arithmetic
  # question. Leave this off unless you also raise max_tokens a long way.
  reasoning: false

  # How OpenRouter picks between the providers serving this model. Its default
  # is cheapest-first, which is the wrong objective for speech: the reply is
  # late by however long the provider takes to produce its first token, and the
  # cheap ones are erratic. Ten identical calls on the default routing all went
  # to GMICloud and ranged 2.09-7.22s to first token.
  #
  # Measured 2026-08-19, five trials each, real system prompt and tool schemas:
  #
  #   ""           median ttft 2.76s, worst 5.22s   (GMICloud, StreamLake)
  #   "latency"    median ttft 1.50s, worst 2.94s   (CoreWeave, GMICloud)
  #   "throughput" median ttft 0.81s, worst 11.36s  (Alibaba)
  #
  # "throughput" has the best median and by far the worst tail. The tail is the
  # half people notice: a reply that is occasionally eleven seconds late is
  # worse than one reliably at a second and a half. Hence "latency".
  #
  # Costs a little more -- routing off price means not always taking the
  # cheapest of the eighteen providers, which span $0.068-$0.44 per M input
  # against GMICloud's $0.084. Set to "" to go back to cheapest-first.
  provider_sort: "latency"
  # The "stand your ground" clause is not decoration. Without it the model
  # folds the moment it is challenged -- it would answer "King Charles the
  # Third" correctly, then on being told "that's wrong" reply "you're right,
  # the United Kingdom doesn't have a king". Confidently wrong on the second
  # try is worse than useless in a voice assistant, where there's no transcript
  # to scroll back through.
  # The name matters more than it looks. This opened "You are Rhasspy" -- four
  # words, one a loaded proper noun with a real referent and no grounding
  # facts. Asked what it was, the model retrieved what it knows about the
  # Rhasspy project and described that instead, fluently and wrongly:
  #
  #   "I am named after the Rhasspy project ... built by the same team."
  #
  # Do not fix that by naming the wake phrase and explaining it away. Measured:
  # a variant adding "people wake you with 'hey rhasspy', which is only a
  # trigger" made it worse -- "I am built on the Rhasspy project's wake-word
  # detection and voice assistant framework". Naming the entity is what
  # activates it. State positively, never deny.
  system_prompt: >-
    You are Faethon, a voice assistant running on a Raspberry Pi in a private
    home. Only your wake-word listening happens on that Pi; you use a cloud
    language model to think, and cloud services to hear and speak.
    Your replies are spoken aloud, so keep them
    brief and conversational -- one or two sentences unless asked for detail.
    Never use markdown, bullet points, or emoji. Write numbers and units the way
    a person would say them.

    Be accurate. If you don't know something, say so plainly rather than
    guessing. If you're unsure how current your information is, say that too.

    If the user says you are wrong, do not simply agree. Reconsider honestly:
    correct yourself only if they have actually identified a mistake. If you
    still believe your answer was right, say so politely and give your reason
    in one sentence. Never apologise for a correct answer.

tts:
  # MUST be set. Several providers, including this one, reject a request with
  # no voice outright ("An explicit voice is required"), and those that accept
  # one pick a different speaker per request -- measured on Fish S1, where
  # pitch ranged 99-156 Hz with no voice set against 101-116 Hz with one, i.e.
  # a different person every time you asked Faethon anything.
  #
  # MAI-Voice-2-Flash uses Azure neural voice names, so the catalogue is
  # hundreds deep across 15 languages. Confirmed working: en-US-AndrewNeural,
  # en-US-AvaNeural, en-US-EmmaNeural, en-US-BrianNeural, en-GB-SoniaNeural,
  # en-GB-RyanNeural, en-AU-NatashaNeural.
  #
  # Andrew for the pace as much as the timbre: the same announcement runs 6.0s
  # in his voice against 8.1s in en-AU-NatashaNeural. That is 35% off the wait
  # on every single reply, and it costs nothing, since billing is per character
  # rather than per second.
  #
  # To list any provider's voices, send a bogus one; the 400 sometimes
  # enumerates them (Deepgram does, Fish and MAI do not).
  voice: "en-US-AndrewNeural"

  # USD per 1000 characters of input text, used to estimate what speaking cost.
  # The speech endpoint returns raw audio with no usage body, /generation 404s
  # for TTS ids, and /credits updates in batches too coarse to attribute one
  # call -- so unlike STT and the LLM there is nothing authoritative to read,
  # and this is the only way the figure includes it at all.
  #
  # Billed on the text sent, not the audio produced. OpenRouter quotes
  # fish-audio/s1 at 0.000015 per input token; five calls totalling 345
  # characters cost $0.001107, which is $0.0032 per thousand characters and
  # agrees with the quoted price at about four characters to the token.
  #
  # Re-measure if you change tts model, or set 0 to leave it out rather than
  # report a number from the wrong price list.
  # Measured against /credits, not quoted: 1124 chars billed $0.01686 and
  # 450 chars billed $0.00675 -- both exactly $0.000015 a character. The two
  # samples spoke at different rates and the figure did not move, so billing
  # follows the text sent, not the audio produced.
  cost_per_1k_chars: 0.015

  # Fallback only. The real rate is read from the response Content-Type, since
  # models disagree (Fish Audio 44.1 kHz, Kokoro and Deepgram 24 kHz) and
  # playing at the wrong one is badly wrong, not subtly wrong.
  sample_rate: 44100
